name: Trading brief

on:
  schedule:
    - cron: "0 17 * * 0"    # Sunday 17:00 UTC = 18:00 Algeria -> weekly brief
    - cron: "30 6 * * 1-5"  # Mon-Fri 06:30 UTC = 07:30 Algeria -> daily brief
  workflow_dispatch:
    inputs:
      mode:
        description: "Which brief to send"
        type: choice
        default: weekly
        options:
          - weekly
          - daily

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance feedparser trafilatura

      - name: Send brief
        run: python brief.py
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '0 17 * * 0' && 'weekly' || 'daily') }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
