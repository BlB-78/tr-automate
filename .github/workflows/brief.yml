name: Trading brief

on:
  schedule:
    # GitHub starts scheduled runs late when it is busy (worst at the top of the hour),
    # so these use odd minutes and start a little early. Times are UTC; Algeria is UTC+1.
    - cron: "43 16 * * 0"   # Sunday 16:43 UTC = 17:43 Algeria -> weekly brief
    - cron: "47 5 * * 1-5"  # Mon-Fri 05:47 UTC = 06:47 Algeria -> daily brief
  workflow_dispatch:
    inputs:
      mode:
        description: "Which brief to send"
        type: choice
        default: weekly
        options:
          - weekly
          - daily
      language:
        description: "Language (default = the BRIEF_LANGUAGE repository variable, or English)"
        type: choice
        default: default
        options:
          - default
          - en
          - ar

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance feedparser trafilatura pypdf

      - name: Send brief
        run: python brief.py
        env:
          CRON: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode || (github.event.schedule == '43 16 * * 0' && 'weekly' || 'daily') }}
          BRIEF_LANGUAGE: ${{ (inputs.language != 'default' && inputs.language) || vars.BRIEF_LANGUAGE || 'en' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
